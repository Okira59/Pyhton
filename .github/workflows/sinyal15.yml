name: Altin 15dk Sinyal Botu

on:
  schedule:
    - cron: "2,17,32,47 * * * *"  # her 15dk mum kapanışından ~2 dk sonra (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinyal15
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sinyal kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_15 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_15 || secrets.TELEGRAM_CHAT_ID }}
        run: python bot15.py --notify
      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain state15.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
            git add state15.json
            git commit -m "15dk sinyal durumu güncellendi [skip ci]"
            git pull --rebase
            git push
          fi
          
