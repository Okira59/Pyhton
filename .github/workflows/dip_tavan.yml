name: Altin Dip-Tavan Botu

on:
  schedule:
    - cron: "2,17,32,47 * * * *"  # her 15dk mum kapanışından ~2 dk sonra (UTC)
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram'a deneme mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dip-tavan
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sinyal kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_15 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_15 || secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_DIP }}
        run: python dip_tavan.py --notify ${{ inputs.test && '--test' || '' }}
      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain dip_tavan_state.json docs/data/dip_tavan.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
            git add dip_tavan_state.json docs/data/dip_tavan.json
            git commit -m "Dip-tavan durumu güncellendi [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break
              sleep $((RANDOM % 10 + 3))
            done
          fi
          
