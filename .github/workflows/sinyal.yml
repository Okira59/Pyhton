name: Altin Sinyal Botu

on:
  schedule:
    - cron: "2,17,32,47 * * * *"  # her 15dk mum kapanışından ~2 dk sonra (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinyal
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # sıradaki çalışma önceki çalışmanın kaydettiği güncel durumu alsın
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sinyal kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID_SINYAL }}
        run: python bot.py --notify
      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain state.json docs/data/sinyal.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
            git add state.json docs/data/sinyal.json
            git commit -m "Sinyal durumu güncellendi [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((RANDOM % 10 + 3))
            done
            echo 'Durum kaydedilemedi'; exit 1
          fi
          
